name: Temporary check of Bend no-guess generator
on:
  push:
    branches: [feat/intermediate-minesweeper-textbook]
    paths:
      - '.github/workflows/intermediate-generator-once.yml'
      - 'intermediate/minesweeper/noguess_generator.bend'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend 2
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check, generate and independently replay
        shell: bash
        run: |
          set -euo pipefail
          export BEND_NO_TELEMETRY=1
          bend intermediate/minesweeper/noguess_generator.bend --check-only
          bend intermediate/minesweeper/noguess_generator.bend | tee /tmp/no-guess-output
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import re
          out=pathlib.Path("/tmp/no-guess-output").read_text().strip()
          m=re.fullmatch(r"mines=(\d+);moves=(\d+(?:,\d+)*)",out)
          assert m, f"No certificate: {out!r}"
          mask=int(m.group(1))
          moves=tuple(map(int,m.group(2).split(",")))
          assert mask.bit_count()==2 and mask&51==0 and moves[0]==0 and len(moves)>=2
          spec=importlib.util.spec_from_file_location("ng", "intermediate/solutions/noguess_reference.py")
          module=importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          truth=frozenset(i for i in range(16) if mask & (1<<i))
          independently_verified=module.verify_no_guess(4,4,truth,0)
          assert independently_verified==moves, (mask,moves,independently_verified)
          print(f"PASS verified certificate: mask={mask}, clicks={moves}")
          PY
