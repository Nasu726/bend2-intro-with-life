name: Temporary intermediate CLI validation and reader sync
# CLI validation passed; rerun TeX after escaping a filename underscore.
on:
  push:
    branches: [feat/intermediate-minesweeper-textbook]
    paths: ['.github/workflows/intermediate-sync-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli-smoke:
    name: Typecheck and run learner CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check CLI and known first click
        shell: bash
        run: |
          set -euo pipefail
          bend intermediate/minesweeper/cli_replay.bend --check-only
          bend intermediate/minesweeper/cli_replay.bend c0 | tee /tmp/cli-output.txt
          python3 - <<'PY'
          from pathlib import Path
          found = Path("/tmp/cli-output.txt").read_text().strip()
          expected = "Playing\n2 . . .\n. . . .\n. . . .\n. . . ."
          assert found == expected, (found, expected)
          PY

  refresh-reader-materials:
    name: Rebuild learner PDF and ZIP
    needs: cli-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intermediate-minesweeper-textbook
      - name: Compile textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Check TeX warnings
        shell: bash
        run: |
          set -euo pipefail
          LOG=Intermediate_Textbook.log
          if test -s intermediate/Intermediate_Textbook.log; then LOG=intermediate/Intermediate_Textbook.log; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            exit 1
          fi
      - name: Build distribution, test allowlist and commit
        shell: bash
        run: |
          set -euo pipefail
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p test_reader_bundle.py -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(intermediate): ship chapter 21 CLI replay edition'
            git push origin HEAD:feat/intermediate-minesweeper-textbook
          fi
