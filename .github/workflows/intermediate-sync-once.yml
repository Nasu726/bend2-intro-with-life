name: Temporary intermediate reader sync
on:
  push:
    branches:
      - feat/intermediate-minesweeper-textbook
    paths:
      - '.github/workflows/intermediate-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intermediate-preview-one-shot
  cancel-in-progress: false

jobs:
  refresh-reader-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intermediate-minesweeper-textbook
      - name: Build intermediate textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Reject PDF layout and font warnings
        shell: bash
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX layout/compatibility warnings detected' >&2
            exit 1
          fi
      - name: Update reader-facing PDF and ZIP
        shell: bash
        run: |
          set -euo pipefail
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(intermediate): synchronize PDF and ZIP after chapter 10 hands-on'
            git push origin HEAD:feat/intermediate-minesweeper-textbook
          fi
