name: Intermediate textbook
on:
  pull_request:
    paths:
      - 'intermediate/**'
      - 'scripts/build_reader_bundle.py'
      - 'tests/test_reader_bundle.py'
      - '.github/workflows/intermediate.yml'
  push:
    branches: [main]
    paths:
      - 'intermediate/**'
      - '.github/workflows/intermediate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bend-examples:
    name: Intermediate Bend examples
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check structural coverage
        run: python3 -m unittest discover -s intermediate/tests -v
      - name: Install Bend 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean 4 proof kernel prerequisite
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check Bend compiler version
        run: bend version
      - name: Typecheck, run and verify proof examples
        run: python3 intermediate/scripts/test_examples.py

  intermediate-pdf:
    name: Intermediate XeLaTeX PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Compile the intermediate textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Check TeX layout and font warnings
        shell: bash
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX layout/compatibility warnings detected' >&2
            exit 1
          fi
      - name: Prepare intermediate PDF
        shell: bash
        run: |
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
      - name: Build intermediate learner ZIP
        run: python3 scripts/build_reader_bundle.py intermediate
      - name: Ensure ZIP contains only permitted learner materials
        run: python3 -m unittest discover -s tests -p 'test_reader_bundle.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: intermediate-reader-materials
          path: |
            intermediate/Bend2を使いこなす_プレビュー.pdf
            reader-packages/bend2-intermediate-reader-preview.zip
      - name: Install PDF text comparison utility
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Verify committed PDF and learner ZIP match the sources
        if: github.event_name == 'pull_request'
        run: python3 intermediate/scripts/check_bundle_consistency.py
