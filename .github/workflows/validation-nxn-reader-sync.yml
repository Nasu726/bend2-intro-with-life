name: Validation N x N reader synchronization
on:
  push:
    branches: ['validation/nxn-reader-20261026']
    paths:
      - 'intermediate/Intermediate_Textbook.tex'
      - '.github/workflows/validation-nxn-reader-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify adopted cover blob
        run: |
          test "$(git rev-parse HEAD:intermediate/cover_art.tex)" = "ba9b5c4cb296e3adfd119ace6b55abc419c6faf1"
      - name: Compile textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Check layout and build learner bundle
        shell: bash
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX warnings' >&2
            exit 1
          fi
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p 'test_reader_bundle.py' -v
          python3 -m unittest discover -s intermediate/tests -p 'test_structure.py' -v
      - name: Commit regenerated PDF and ZIP on validation branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'intermediate/Bend2を使いこなす_プレビュー.pdf' reader-packages/bend2-intermediate-reader-preview.zip
          if ! git diff --cached --quiet; then
            git commit -m 'build(intermediate): synchronize validated N x N reader materials'
            git push origin HEAD:validation/nxn-reader-20261026
          fi
