name: Temporary Bend CLI save and restore smoke
on:
  push:
    branches: [feat/intermediate-minesweeper-textbook]
    paths:
      - '.github/workflows/intermediate-storage-once.yml'
      - 'intermediate/minesweeper/cli_save.bend'
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend 2
        run: |
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Validate CLI saves, loads, and corrupt-file refusal
        shell: bash
        run: |
          set -euo pipefail
          export BEND_NO_TELEMETRY=1
          bend intermediate/minesweeper/cli_save.bend --check-only
          tmp=$(mktemp -d)
          entry="$GITHUB_WORKSPACE/intermediate/minesweeper/cli_save.bend"
          cd "$tmp"
          bend "$entry" save c0 f1
          test "$(cat minesweeper_save.txt)" = 'BEND2-SAVE-1|c0|f1|END'
          bend "$entry" load | tee /tmp/intermediate-loaded
          python3 - <<'PY'
          from pathlib import Path
          assert Path('/tmp/intermediate-loaded').read_text().strip() == (
            'Playing\n2 F . .\n. . . .\n. . . .\n. . . .'
          )
          PY
          if bend "$entry" save c16; then echo 'accepted invalid command'; exit 1; fi
          test "$(cat minesweeper_save.txt)" = 'BEND2-SAVE-1|c0|f1|END'
          printf 'BEND2-SAVE-1|c0|END|garbage' > minesweeper_save.txt
          if bend "$entry" load; then echo 'accepted malformed file'; exit 1; fi
          printf 'BEND2-SAVE-9|c0|END' > minesweeper_save.txt
          if bend "$entry" load; then echo 'accepted unknown version'; exit 1; fi
          echo "PASS: save, load, invalid command, damaged history and version check"
