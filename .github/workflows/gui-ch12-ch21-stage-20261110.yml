# One-shot isolated PDF/ZIP build; never included in the final canonical tree.
name: Stage verified chapter 12-21 text and reader PDF
on:
  push:
    branches: [verify/gui-ch12-ch21-proofread-20261110]
    paths:
      - .github/workflows/gui-ch12-ch21-stage-20261110.yml
permissions:
  contents: write
concurrency:
  group: gui-ch12-ch21-stage-20261110
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'Nasu726/bend2-intro-with-life'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/gui-ch12-ch21-proofread-20261110
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check adopted cover and editorial tests before building
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object intermediate/cover_art.tex)" = ba9b5c4cb296e3adfd119ace6b55abc419c6faf1
          python3 -m unittest discover -s intermediate/tests -v
          python3 -m unittest discover -s tests -p test_reader_bundle.py -v
      - name: Compile exact TeX with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Verify PDF layout, cover pixels and reader ZIP
        shell: bash
        run: |
          set -euo pipefail
          LOG=Intermediate_Textbook.log
          if test -s intermediate/Intermediate_Textbook.log; then LOG=intermediate/Intermediate_Textbook.log; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'XeLaTeX layout/font warning' >&2
            exit 1
          fi
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p test_reader_bundle.py -v
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          test "$(git hash-object intermediate/cover_art.tex)" = ba9b5c4cb296e3adfd119ace6b55abc419c6faf1
          git show HEAD:'intermediate/Bend2を使いこなす_プレビュー.pdf' > "$RUNNER_TEMP/old.pdf"
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png "$RUNNER_TEMP/old.pdf" "$RUNNER_TEMP/old-cover"
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' "$RUNNER_TEMP/new-cover"
          cmp "$RUNNER_TEMP/old-cover.png" "$RUNNER_TEMP/new-cover.png"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          pdf=Path('intermediate/Bend2を使いこなす_プレビュー.pdf').read_bytes()
          with zipfile.ZipFile('reader-packages/bend2-intermediate-reader-preview.zip') as z:
              names=z.namelist()
              assert len(names)==103 and len(names)==len(set(names)),len(names)
              assert z.testzip() is None
              assert z.read('bend2-intermediate-reader/textbook.pdf')==pdf
              assert not any('solutions' in x.lower() or x.endswith(('.py','.tex')) for x in names)
          text=subprocess.check_output(['pdftotext','-layout','-','-'],input=pdf)
          assert len(text)>5000
          assert '原子的保存候補の配布検収' not in text.decode('utf8')
          print('PASS reader ZIP, PDF content, unchanged cover')
          PY
          mkdir -p "$RUNNER_TEMP/pages"
          pdftoppm -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' "$RUNNER_TEMP/pages/book" >/dev/null 2>&1
          pages="$(pdfinfo 'intermediate/Bend2を使いこなす_プレビュー.pdf' | awk '/^Pages:/ {print $2}')"
          count="$(find "$RUNNER_TEMP/pages" -type f -name 'book-*.png' | wc -l)"
          test "$pages" -ge 120
          test "$pages" -eq "$count"
          echo "PASS $count complete PDF pages"
      - name: Commit regenerated PDF and ZIP only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/verify/gui-ch12-ch21-proofread-20261110 | cut -f1)"
          test "$remote" = "$GITHUB_SHA" || { echo 'Concurrent update detected; refusing push' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          git diff --cached --quiet && { echo 'Expected a changed PDF/ZIP' >&2; exit 1; }
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'build: synchronize chapter 12-21 revised PDF and reader ZIP'
          git push origin HEAD:refs/heads/verify/gui-ch12-ch21-proofread-20261110
          python3 intermediate/scripts/check_bundle_consistency.py
