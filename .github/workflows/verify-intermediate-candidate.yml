name: Intermediate candidate preflight
on:
  push:
    branches: [validation/ch7-ch8-ci-contract-20261022]
    paths:
      - '.github/workflows/verify-intermediate-candidate.yml'
      - 'intermediate/**'
permissions:
  contents: read

jobs:
  bend-examples:
    name: Intermediate Bend examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BEND_NO_TELEMETRY: '1'
      BEND_NXN_CLUE_BATCH_SIZE: '64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check structural coverage
        run: python3 -m unittest discover -s intermediate/tests -v
      - name: Install Bend 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean 4 proof kernel prerequisite
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check Bend compiler version
        run: bend version
      - name: Typecheck, run and verify proof examples
        run: python3 intermediate/scripts/test_examples.py
      - name: Verify N x N Bend geometry against independent coordinates
        run: python3 intermediate/scripts/test_nxn_geometry.py
      - name: Verify N x N public opened clues against audited replay
        run: python3 intermediate/scripts/verify_nxn_public_state.py
      - name: Compile native C and execute JavaScript target
        run: python3 intermediate/scripts/test_targets.py

  intermediate-pdf:
    name: Intermediate XeLaTeX PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preserve committed preview for cover pixel comparison
        run: cp 'intermediate/Bend2を使いこなす_プレビュー.pdf' /tmp/committed-preview.pdf
      - name: Compile the intermediate textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Check TeX layout and font warnings
        shell: bash
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX layout/compatibility warnings detected' >&2
            exit 1
          fi
      - name: Prepare intermediate PDF
        shell: bash
        run: |
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
      - name: Build intermediate learner ZIP
        run: python3 scripts/build_reader_bundle.py intermediate
      - name: Ensure ZIP contains only permitted learner materials
        run: python3 -m unittest discover -s tests -p 'test_reader_bundle.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: intermediate-reader-materials
          path: |
            intermediate/Bend2を使いこなす_プレビュー.pdf
            reader-packages/bend2-intermediate-reader-preview.zip
      - name: Install PDF image comparison utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Verify candidate PDF, ZIP and adopted cover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          from scripts.build_reader_bundle import INTERMEDIATE_EXAMPLES, INTERMEDIATE_GAME_FILES
          cover = Path('intermediate/cover_art.tex').read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(cover)).encode() + b'\0' + cover).hexdigest()
          assert sha == 'ba9b5c4cb296e3adfd119ace6b55abc419c6faf1', sha
          pdf = Path('intermediate/Bend2を使いこなす_プレビュー.pdf').read_bytes()
          with zipfile.ZipFile('reader-packages/bend2-intermediate-reader-preview.zip') as z:
              names = z.namelist()
              assert len(names) == 3 + len(INTERMEDIATE_EXAMPLES) + len(INTERMEDIATE_GAME_FILES) == 68
              assert len(names) == len(set(names))
              assert z.read('bend2-intermediate-reader/textbook.pdf') == pdf
              assert z.testzip() is None
          print('PASS cover blob, reader allowlist, PDF byte identity')
          PY
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png /tmp/committed-preview.pdf /tmp/old-cover
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' /tmp/new-cover
          cmp /tmp/old-cover.png /tmp/new-cover.png
          pdfinfo 'intermediate/Bend2を使いこなす_プレビュー.pdf' | grep '^Pages:'
