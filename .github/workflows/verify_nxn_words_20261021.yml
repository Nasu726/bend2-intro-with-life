name: Temporary N×N word verification (not PR)
on:
  push:
    branches: [verify/nxn-word-validation-20261021]
permissions:
  contents: write
jobs:
  bend-and-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All intermediate Python reference tests
        run: python3 -m unittest discover -s intermediate/tests -v
      - name: Install Bend 2
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install Lean kernel
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: N×N bit-packed words typecheck and 306 output checks
        run: python3 intermediate/scripts/test_nxn_mine_words.py
      - name: N×N geometry and mine-word integration
        run: python3 intermediate/scripts/test_nxn_geometry.py
      - name: All existing Bend examples, law proofs and File/IO exercises
        run: python3 intermediate/scripts/test_examples.py
      - name: Native/JS target regression
        run: python3 intermediate/scripts/test_targets.py
  latex-and-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Reject TeX warnings
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then exit 1; fi
      - name: Rebuild, verify cover and synchronize PDF plus learner ZIP on verification branch
        run: |
          set -euo pipefail
          if test -s Intermediate_Textbook.pdf; then cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'; else cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'; fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p 'test_reader_bundle.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import zipfile
          pdfname = 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          old = subprocess.check_output(['git','show','HEAD:' + pdfname])
          new = Path(pdfname).read_bytes()
          with tempfile.TemporaryDirectory() as td:
              outputs = []
              for name, data in [('old',old),('new',new)]:
                  p = Path(td) / (name + '.pdf')
                  p.write_bytes(data)
                  subprocess.run(['pdftoppm','-f','1','-l','1','-r','72','-png',str(p),str(Path(td)/name)], check=True)
                  images = sorted(Path(td).glob(name+'-*.png'))
                  if len(images) != 1:
                      raise AssertionError('first page not rendered')
                  outputs.append(images[0].read_bytes())
              if outputs[0] != outputs[1]:
                  raise AssertionError('adopted cover appearance changed')
          reader = Path('reader-packages/bend2-intermediate-reader-preview.zip')
          with zipfile.ZipFile(reader) as zf:
              embedded = [n for n in zf.namelist() if n.endswith('/textbook.pdf')]
              if len(embedded) != 1 or zf.read(embedded[0]) != new:
                  raise AssertionError('ZIP embedded PDF does not match source PDF bytes')
          print('PASS: adopted cover pixels unchanged; ZIP PDF exactly matches rebuilt PDF')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          git commit -m "build(verify): align TCP source listing, PDF and reader ZIP"
          python3 intermediate/scripts/check_bundle_consistency.py
          git push origin HEAD:refs/heads/verify/nxn-word-validation-20261021
