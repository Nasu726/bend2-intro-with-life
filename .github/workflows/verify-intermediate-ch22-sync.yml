name: Verify and synchronize chapter 22 learner artifacts (temporary)
on:
  push:
    branches:
      - verify/intermediate-ch22-tex-20261028

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/intermediate-ch22-tex-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect adopted cover and ensure 23 chapters
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object intermediate/cover_art.tex)" = "ba9b5c4cb296e3adfd119ace6b55abc419c6faf1"
          python3 -m unittest discover -s intermediate/tests -p 'test_structure.py' -v
      - name: Install Bend 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Typecheck and run all three new reader examples
        shell: bash
        run: |
          set -euo pipefail
          for file in nxn_public_three_fixpoint nxn_public_many_fixpoint nxn_public_pair_gap; do
            bend "intermediate/minesweeper/$file.bend" --check-only
          done
          test "$(bend intermediate/minesweeper/nxn_public_three_fixpoint.bend | tail -n1)" = "206"
          test "$(bend intermediate/minesweeper/nxn_public_many_fixpoint.bend | tail -n1)" = "6"
          test "$(bend intermediate/minesweeper/nxn_public_pair_gap.bend | tail -n1)" = "203"
      - name: Compile the intermediate textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Verify TeX log and update learner PDF
        shell: bash
        run: |
          set -euo pipefail
          LOG='Intermediate_Textbook.log'
          if test -s intermediate/Intermediate_Textbook.log; then LOG='intermediate/Intermediate_Textbook.log'; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX layout or font warning' >&2
            exit 1
          fi
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
      - name: Rebuild ZIP from the exact new PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p 'test_reader_bundle.py' -v
      - name: Verify PDF content, cover pixels, ZIP payload, and sample scope
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          git show HEAD:'intermediate/Bend2を使いこなす_プレビュー.pdf' > /tmp/ch22-old.pdf
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png /tmp/ch22-old.pdf /tmp/ch22-old-cover
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' /tmp/ch22-new-cover
          cmp /tmp/ch22-old-cover.png /tmp/ch22-new-cover.png
          pdftotext -layout 'intermediate/Bend2を使いこなす_プレビュー.pdf' /tmp/ch22-text.txt
          grep -q '固定点まで繰り返す' /tmp/ch22-text.txt
          grep -q '差集合で、固定点の先へ進む' /tmp/ch22-text.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path("intermediate/Bend2を使いこなす_プレビュー.pdf").read_bytes()
          with zipfile.ZipFile("reader-packages/bend2-intermediate-reader-preview.zip") as z:
              names = z.namelist()
              assert len(names) == 89, len(names)
              assert z.read("bend2-intermediate-reader/textbook.pdf") == p
              for name in ("nxn_public_three_fixpoint.bend",
                           "nxn_public_many_fixpoint.bend",
                           "nxn_public_pair_gap.bend"):
                  key = "bend2-intermediate-reader/examples/minesweeper/" + name
                  assert z.read(key) == Path("intermediate/minesweeper", name).read_bytes()
              assert not any("/solutions/" in x or x.endswith(".py") or x.endswith(".tex") for x in names)
          print("PASS: 89 ZIP entries, PDF byte identity, learner-only samples")
          PY
          pdfinfo 'intermediate/Bend2を使いこなす_プレビュー.pdf' | grep Pages
      - name: Commit verified PDF and ZIP only on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "Synchronize verified chapter 22 PDF and learner ZIP"
          git push origin HEAD:refs/heads/verify/intermediate-ch22-tex-20261028
