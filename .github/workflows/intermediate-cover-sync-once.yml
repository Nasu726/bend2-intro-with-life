name: One-shot intermediate cover artifact sync
on:
  push:
    branches:
      - feat/intermediate-minesweeper-textbook
    paths:
      - intermediate/cover_art.tex

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: XeLaTeX textbook
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Check layout and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          LOG=Intermediate_Textbook.log
          if test -s intermediate/Intermediate_Textbook.log; then LOG=intermediate/Intermediate_Textbook.log; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo 'TeX layout or font warning found.' >&2
            exit 1
          fi
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s tests -p test_reader_bundle.py -v
          pdfinfo 'intermediate/Bend2を使いこなす_プレビュー.pdf' | grep -E '^Pages:|^Page size:'
      - name: Commit PDF, reader ZIP, and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          git rm .github/workflows/intermediate-cover-sync-once.yml
          git commit -m "docs(intermediate): regenerate C-cover PDF and learner bundle"
          git push origin HEAD:feat/intermediate-minesweeper-textbook
