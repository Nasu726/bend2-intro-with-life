# Temporary, verification-branch-only staging workflow.
# This file is removed before opening the final validation PR.
name: Stage intermediate atomic reader artifacts
on:
  push:
    branches:
      - verify/intermediate-atomic-reader-integration-20261102
    paths:
      - .github/workflows/intermediate-reader-atomic-stage.yml
permissions:
  contents: write
concurrency:
  group: intermediate-atomic-reader-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'Nasu726/bend2-intro-with-life'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check cover and local static contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object intermediate/cover_art.tex)" = ba9b5c4cb296e3adfd119ace6b55abc419c6faf1
          python3 intermediate/scripts/test_nxn_gui_atomic_store.py --static-only
          ! grep -q 'この配布GUIへの接続候補' intermediate/Intermediate_Textbook.tex
          ! grep -q '同一版検収はまだです' intermediate/Intermediate_Textbook.tex
          python3 -m unittest discover -s intermediate/tests -p 'test_chapter_flow.py' -v
          python3 -m unittest discover -s intermediate/tests -p 'test_gui_editorial_consistency.py' -v
      - name: Install native GUI prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libx11-dev clang poppler-utils
          python3 -m pip install --disable-pip-version-check pillow
          python3 intermediate/scripts/test_nxn_gui_desktop.py --static-only
      - name: Install Bend 2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Typecheck and execute atomic save cases
        run: python3 intermediate/scripts/test_nxn_gui_atomic_store.py
      - name: Execute real X11 window, input and persistence cases
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/atomic-gui"
          GUI_SMOKE_SCREENSHOTS="$RUNNER_TEMP/atomic-gui" xvfb-run -a -s '-screen 0 1280x960x24' python3 intermediate/scripts/test_nxn_gui_desktop.py
      - name: Compile the exact TeX source
        uses: xu-cheng/latex-action@v4
        with:
          root_file: intermediate/Intermediate_Textbook.tex
          latexmk_use_xelatex: true
          texlive_version: '2025'
          os: debian
          extra_system_packages: fonts-noto-cjk fonts-noto-core
      - name: Verify layout and regenerate both learner artifacts
        shell: bash
        run: |
          set -euo pipefail
          LOG=Intermediate_Textbook.log
          if test -s intermediate/Intermediate_Textbook.log; then LOG=intermediate/Intermediate_Textbook.log; fi
          test -s "$LOG"
          if grep -nE 'Overfull|Underfull|LaTeX Font Warning|LaTeX Warning' "$LOG"; then
            echo "TeX layout or font warning" >&2
            exit 1
          fi
          if test -s Intermediate_Textbook.pdf; then
            cp Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          else
            cp intermediate/Intermediate_Textbook.pdf 'intermediate/Bend2を使いこなす_プレビュー.pdf'
          fi
          python3 scripts/build_reader_bundle.py intermediate
          python3 -m unittest discover -s intermediate/tests -v
          python3 -m unittest discover -s tests -p test_reader_bundle.py -v
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess, hashlib
          pdf=Path('intermediate/Bend2を使いこなす_プレビュー.pdf')
          zippath=Path('reader-packages/bend2-intermediate-reader-preview.zip')
          with zipfile.ZipFile(zippath) as z:
              names=z.namelist()
              assert len(names)==103 and len(set(names))==103, len(names)
              assert z.testzip() is None
              assert z.read('bend2-intermediate-reader/textbook.pdf') == pdf.read_bytes()
              assert not any(name.endswith(('.tex','.py')) or 'solutions' in name.lower() for name in names)
              print('PASS 103 reader entries; exact embedded PDF; no solutions')
          text=subprocess.check_output(['pdftotext','-layout',str(pdf),'-'])
          assert len(text)>5000, len(text)
          pages=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
          print('PDF',next(line for line in pages.splitlines() if line.startswith('Pages:')))
          assert hashlib.sha1(b'blob '+str(Path('intermediate/cover_art.tex').stat().st_size).encode()+b'\0'+Path('intermediate/cover_art.tex').read_bytes()).hexdigest()=='ba9b5c4cb296e3adfd119ace6b55abc419c6faf1'
          PY
          # Compare the rendered adopted cover against the previous release.
          git show HEAD:'intermediate/Bend2を使いこなす_プレビュー.pdf' > "$RUNNER_TEMP/previous.pdf"
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png "$RUNNER_TEMP/previous.pdf" "$RUNNER_TEMP/old-cover"
          pdftoppm -f 1 -l 1 -singlefile -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' "$RUNNER_TEMP/new-cover"
          cmp "$RUNNER_TEMP/old-cover.png" "$RUNNER_TEMP/new-cover.png"
          # Render EVERY page, rather than checking only extractable text.
          mkdir -p "$RUNNER_TEMP/pages"
          pdftoppm -r 72 -png 'intermediate/Bend2を使いこなす_プレビュー.pdf' "$RUNNER_TEMP/pages/book" >/dev/null 2>&1
          expected_pages="$(pdfinfo 'intermediate/Bend2を使いこなす_プレビュー.pdf' | awk '/^Pages:/ {print $2}')"
          actual_pages="$(find "$RUNNER_TEMP/pages" -name 'book-*.png' -type f | wc -l)"
          test "$expected_pages" -ge 120
          test "$actual_pages" -eq "$expected_pages"
          echo "PASS unchanged rendered cover and $actual_pages fully rendered pages"
      - name: Commit only regenerated PDF and reader ZIP to verification branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object intermediate/cover_art.tex)" = ba9b5c4cb296e3adfd119ace6b55abc419c6faf1
          current="$(git ls-remote origin refs/heads/verify/intermediate-atomic-reader-integration-20261102 | cut -f1)"
          test "$current" = "$GITHUB_SHA" || { echo "Concurrent branch update; refusing to overwrite"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'intermediate/Bend2を使いこなす_プレビュー.pdf' 'reader-packages/bend2-intermediate-reader-preview.zip'
          git diff --cached --quiet && { echo 'Expected updated PDF/ZIP, but no diff'; exit 1; }
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'build(intermediate): synchronize verified atomic GUI PDF and 103-entry reader ZIP'
          git push origin HEAD:refs/heads/verify/intermediate-atomic-reader-integration-20261102
          python3 intermediate/scripts/check_bundle_consistency.py
      - name: Preserve X11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-reader-x11-staging-evidence
          path: ${{ runner.temp }}/atomic-gui/
          if-no-files-found: ignore
