name: Temporary intermediate GUI smoke
# Pixel-affinity fix
on:
  push:
    branches: [feat/intermediate-minesweeper-textbook]
    paths: ['.github/workflows/intermediate-gui-smoke-once.yml', 'intermediate/minesweeper/gui.bend', 'intermediate/minesweeper/gui_smoke.bend', 'intermediate/minesweeper/public_solver.bend']
permissions:
  contents: read
jobs:
  gui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intermediate-minesweeper-textbook
      - name: Install Bend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bend-lang.com/install.sh -o /tmp/install-bend.sh
          sh /tmp/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install X11 development headers for native GUI build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev
      - name: Typecheck GUI, verify 12 pure checks, compile executable
        shell: bash
        run: |
          set -euo pipefail
          bend intermediate/minesweeper/gui.bend --check-only
          bend intermediate/minesweeper/gui_smoke.bend --check-only
          actual=$(bend intermediate/minesweeper/gui_smoke.bend | tail -n 1)
          test "$actual" = 12
          bend intermediate/minesweeper/gui.bend -o /tmp/minesweeper-gui
          test -x /tmp/minesweeper-gui
          bend intermediate/minesweeper/public_solver.bend --check-only
          safe=$(bend intermediate/minesweeper/public_solver.bend | tail -n 1)
          test "$safe" = 50
